name: Release APK

# Builds MY_ASEAN_TV.apk and publishes it as a GitHub Release asset
# (direct download link; no login needed when the repository is public).
#
# Start it from Actions → "Release APK" → Run workflow (enter e.g. v1.0.0),
# or push a tag like v1.0.0. The workflow creates the tag if it is missing.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, e.g. v1.0.0"
        required: true
        default: "v1.0.0"
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.32.8"
          channel: stable
          cache: true

      - run: flutter pub get
      - run: dart run tool/validate_db.dart
      - run: flutter analyze
      - run: flutter test

      - name: Configure release signing (optional)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        if: env.KEYSTORE_B64 != ''
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          {
            echo "storeFile=$RUNNER_TEMP/release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties

      - name: Build APKs
        run: |
          flutter build apk --release
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/MY_ASEAN_TV.apk
          flutter build apk --release --split-per-abi
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk dist/MY_ASEAN_TV-armeabi-v7a.apk
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk dist/MY_ASEAN_TV-arm64-v8a.apk
          cd dist && sha256sum *.apk > SHA256SUMS.txt && cat SHA256SUMS.txt

      - name: Verify minSdk 23
        run: |
          AAPT=$(ls "$ANDROID_HOME"/build-tools/*/aapt | tail -1)
          for f in dist/*.apk; do "$AAPT" dump badging "$f" | grep -q "sdkVersion:'23'" || { echo "$f: wrong minSdk"; exit 1; }; done

      - name: Signing note
        id: signing
        run: |
          if [ -f android/key.properties ]; then echo "note=Signed with the project release key." >> "$GITHUB_OUTPUT";
          else echo "note=Signed with a DEBUG key (for testing only, not for Play Store)." >> "$GITHUB_OUTPUT"; fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: MY ASEAN TV ${{ inputs.tag || github.ref_name }}
          files: |
            dist/MY_ASEAN_TV.apk
            dist/MY_ASEAN_TV-armeabi-v7a.apk
            dist/MY_ASEAN_TV-arm64-v8a.apk
            dist/SHA256SUMS.txt
          body: |
            ## Muat turun

            | Fail | Untuk |
            |---|---|
            | **MY_ASEAN_TV.apk** | Semua peranti (universal) – pilih ini jika tidak pasti |
            | MY_ASEAN_TV-armeabi-v7a.apk | Kebanyakan Android TV Box (32-bit), lebih kecil |
            | MY_ASEAN_TV-arm64-v8a.apk | Telefon/TV Box 64-bit, lebih kecil |

            Minimum **Android 6.0 (API 23)**. ${{ steps.signing.outputs.note }}

            Pasang: `adb install -r MY_ASEAN_TV.apk`, atau salin ke USB dan buka dengan pengurus fail (benarkan "Unknown sources").

            ## Status

            - Senarai saluran: 36 saluran (MY, ID, SG, BN) dengan pautan **platform rasmi**.
            - **Belum ada URL stream terus yang disahkan**. Saluran dibuka melalui platform rasmi penyiar. URL ditambah melalui `database/` di GitHub tanpa APK baharu.
            - Uji pemain: Tetapan → **UJI PEMAIN HLS**.
            - Belum diuji pada peranti Android 6.0 / TV Box 2 GB sebenar (lihat `documentation/TEST_REPORT.md`).
